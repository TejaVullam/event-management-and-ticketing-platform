services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: ./server
    depends_on: [mongo, redis]
    ports: ["4000:4000"]
    environment:
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/event_booking
      REDIS_URL: redis://redis:6379
      CLIENT_URL: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:-replace-this-in-production}
  worker:
    build: ./server
    command: npm run worker
    depends_on: [mongo, redis]
    environment:
      MONGO_URI: mongodb://mongo:27017/event_booking
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-replace-this-in-production}
  web:
    build: ./client
    depends_on: [api]
    ports: ["5173:80"]
volumes:
  mongo_data:
